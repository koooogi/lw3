<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Archive by kogi</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>:D️ Mission Archive</h1>
            <p class="subtitle">Tokyo Magic College — Analytical Department</p>
        </header>

        <!-- Upload Section -->
        <section class="card upload-card">
            <h2>📤 Upload Mission</h2>
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <p>Drag & drop file here or click to select</p>
                <input type="file" id="fileInput" accept=".txt,.json,.xml,.yaml,.yml" hidden>
                <button class="btn btn-primary" id="selectFileBtn">Select File</button>
            </div>
            <div id="uploadResult" class="upload-result hidden"></div>
        </section>

        <!-- Filters Section -->
        <section class="card filters-card">
            <h2>🔍 Filters</h2>
            <div class="filters">
                <div class="filter-group">
                    <label>Search by ID</label>
                    <input type="text" id="filterMissionId" placeholder="M-2024-...">
                </div>
                <div class="filter-group">
                    <label>Outcome</label>
                    <select id="filterOutcome">
                        <option value="">All</option>
                        <option value="SUCCESS">SUCCESS</option>
                        <option value="FAILURE">FAILURE</option>
                        <option value="PARTIAL_SUCCESS">PARTIAL_SUCCESS</option>
                    </select>
                </div>
                <button class="btn btn-secondary" id="applyFilters">Apply</button>
                <button class="btn btn-outline" id="resetFilters">Reset</button>
            </div>
        </section>

        <!-- Missions List Section -->
        <section class="card missions-card">
            <div class="missions-header">
                <h2>📜 Missions List</h2>
                <button class="btn btn-refresh" id="refreshBtn">🔄 Refresh</button>
            </div>
            <div id="missionsList" class="missions-list">
                <div class="loading">Loading...</div>
            </div>
        </section>

        <!-- Report Modal -->
        <div id="reportModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>📄 Mission Report</h2>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="report-options">
                        <label>Report Type:</label>
                        <select id="reportType">
                            <option value="simple">Simple</option>
                            <option value="detailed">Detailed</option>
                            <option value="risk">Risk Assessment</option>
                            <option value="full">Full Report</option>
                        </select>
                        <button class="btn btn-primary" id="generateReportBtn">Generate</button>
                    </div>
                    <pre id="reportContent" class="report-content">Select report type and click "Generate"</pre>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js?v=2"></script>
</body>
</html>
