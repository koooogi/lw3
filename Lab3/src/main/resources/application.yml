spring:
  application:
    name: magical_analyzer
  
  datasource:
    url: jdbc:postgresql://localhost:5432/magical_analyzer
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres14

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        
  springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
    
  logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

