spring:
  application:
    name: magical_analyzer
  
  datasource:
    url: jdbc:postgresql://localhost:5432/magical_analyzer
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres-14

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    use-root-path: true
  api-docs:
    path: /api-docs

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
